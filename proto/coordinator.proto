syntax = "proto3";

package coordinator;

enum ClientTaskStatus {
    IDLE = 0;
    TASKED = 1;
    IN_PROGRESS = 2;
    COMPLETED = 3;
    FAILED = 4;
}

service Coordinator {
    rpc RequestTask(TaskStatusRequest) returns (TaskStatusResponse);
    rpc UpdateTaskStatus(TaskStatusRequest) returns (TaskStatusResponse);

    rpc SendHeartbeat(HeartbeatRequest) returns (HeartbeatResponse);

    rpc UpdatePrimaryFileServer(PrimaryFileServerAddr) returns (PrimaryFileServer); //TODO: For new Primary File Server to inform Coordinator
    rpc CheckNewPrimaryFileServer(PrimaryFileServer) returns (PrimaryFileServerAddr); //TODO: For Client to probe for new Primary File Server
}

enum TaskType {
    FIND_PRIMES = 0;
    MERGE = 1;
}

message TaskStatusRequest {
    string client_id = 1;
    ClientTaskStatus client_task_status = 2;
}

message TaskStatusResponse {
    string task_id = 5;
    bool has_task = 1;
    TaskType task_type = 2;
    string primary_fileserver_addr = 3;

    // For FIND_PRIMES task:
    string filename = 4;

    // For MERGE task:
    string file1 = 6;
    string file2 = 7;
}

message TaskCompletionRequest {
    string client_id = 1;
    string task_id = 2;
}

message TaskCompletionResponse {
    bool acknowledged = 1;
}

message HeartbeatRequest {
    string client_id = 1;
}

message HeartbeatResponse {
    bool acknowledged = 1;
}

message PrimaryFileServerAddr {
    string primary_fileserver_addr = 1;
}

message PrimaryFileServer {}