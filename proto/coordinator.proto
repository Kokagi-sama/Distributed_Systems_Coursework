syntax = "proto3";

package coordinator;

service Coordinator {
    rpc RequestWork(WorkRequest) returns (WorkResponse);
    rpc SubmitPrimes(SubmitRequest) returns (SubmitResponse);
    rpc SendHeartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message WorkRequest {
    string client_id = 1;
}

message WorkResponse {
    bool has_work = 1;
    string filename = 2;
    string fileserver_address = 3;
}

message SubmitRequest {
    string client_id = 1;
    string filename = 2;
    repeated uint64 primes = 3;
}

message SubmitResponse {
    bool success = 1;
}

message HeartbeatRequest {
    string client_id = 1;
}

message HeartbeatResponse {
    bool acknowledged = 1;
}