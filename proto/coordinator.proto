syntax = "proto3";

package coordinator;

service Coordinator {
    rpc RequestTask(TaskRequest) returns (TaskResponse);
    rpc SubmitPrimes(SubmitRequest) returns (SubmitResponse);
    rpc SendHeartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message TaskRequest {
    string client_id = 1;
}

message TaskResponse {
    bool has_task = 1;
    string filename = 2;
    string fileserver_address = 3;
}

message SubmitRequest {
    string client_id = 1;
    string filename = 2;
    repeated uint64 primes = 3;
}

message SubmitResponse {
    bool success = 1;
}

message HeartbeatRequest {
    string client_id = 1;
}

message HeartbeatResponse {
    bool acknowledged = 1;
}