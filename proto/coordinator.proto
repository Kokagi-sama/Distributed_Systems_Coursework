syntax = "proto3";

package coordinator;

service Coordinator {
    rpc RequestTask(TaskRequest) returns (TaskResponse);
    rpc UpdateTaskStatus(TaskStatusRequest) returns (TaskStatusResponse);

    rpc SendHeartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

enum ClientTaskStatus {
    COMPLETED = 0;
    WAIT = 1;
}

enum TaskType {
    FIND_PRIMES = 0;
    MERGE = 1;
}

message TaskRequest {
    string client_id = 1;
}

message TaskResponse {
    string task_id = 1;
    bool has_task = 2;
    TaskType task_type = 3;
    ClientTaskStatus client_task_status = 4;

    // For FIND_PRIMES task:
    string filename = 5;

    // For MERGE task:
    string file1 = 6;
    string file2 = 7;

    // FOR SPLIT task:
    int64 start_index = 8;
    int64 end_index = 9;
}

message TaskStatusRequest {
    string client_id = 1;
    string task_id =2;
    ClientTaskStatus client_task_status = 3;
    
    // FOR OUTPUT FILE:
    string output_filename = 4;
}

message TaskStatusResponse {
    bool acknowledged = 1;
}

message HeartbeatRequest {
    string client_id = 1;
}

message HeartbeatResponse {
    bool acknowledged = 1;
    
    // FOR SNAPSHOT:
    bool trigger_snapshot = 2;
    string snapshot_id = 3;
}