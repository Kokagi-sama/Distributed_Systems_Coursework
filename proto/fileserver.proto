syntax = "proto3";

package fileserver;

service FileServer {
    rpc FetchFile(MetaData) returns (stream FetchResponse);
    rpc UploadFile(stream UploadRequest) returns (UploadResponse);

    rpc RetrieveFileList(RetrieveFileListRequest) returns (RetrieveFileListResponse);
}

message FetchResponse {
    bool success = 1;
    bytes file_data = 2;
    string error_message = 3;
}

message UploadRequest {
    oneof request {
        MetaData metadata = 1;
        bytes file_data = 2;
    }
}

message UploadResponse {
    bool success = 1;
    string error_message = 2;
}

message MetaData {
    string filename = 1;
    string extension = 2;
}

message RetrieveFileListRequest {
    string data_type = 1;
}

message RetrieveFileListResponse {
    map<int32, MetaData> file_list = 1;
}